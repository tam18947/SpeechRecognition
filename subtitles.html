<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper CPU/WebGPU Speech Recognition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .item { opacity: 0; }
    .item:hover { opacity: 1; }
  </style>
</head>

<body class="bg-dark overflow-hidden">
  <header>
    <div class="item bg-light" style="padding: 10px; width: 100%; position: fixed;">

      <input id="size1" type="range" value="500" min="25" max="500" step="5"
        oninput="document.getElementById('text').style.fontSize = this.value + '%'; document.getElementById('text_size_view1').innerHTML=this.value;" />
      <span id="text_size_view1">500</span>%

      音声言語
      <select id="trans_sourcelang">
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
        <option value="zh">中国語</option>
        <option value="zh-TW">台湾語</option>
        <option value="fr">フランス語</option>
        <option value="it">イタリア語</option>
        <option value="de">ドイツ語</option>
        <option value="ru">ロシア語</option>
        <option value="es">スペイン語</option>
        <option value="pt">ポルトガル語</option>
        <option value="nl">オランダ語</option>
        <option value="id">インドネシア語</option>
        <option value="vi">ベトナム語</option>
        <option value="th">タイ語</option>
        <option value="ar">アラビア語</option>
        <option value="so">ソマリ語</option>
      </select>

      翻訳言語
      <select id="trans_targetlang">
        <option value="none" selected>なし</option>
        <option value="ja">日本語</option>
        <option value="en">英語</option>
        <option value="ko">韓国語</option>
        <option value="zh">中国語</option>
        <option value="zh-TW">台湾語</option>
        <option value="fr">フランス語</option>
        <option value="it">イタリア語</option>
        <option value="de">ドイツ語</option>
        <option value="ru">ロシア語</option>
        <option value="es">スペイン語</option>
        <option value="pt">ポルトガル語</option>
        <option value="nl">オランダ語</option>
        <option value="id">インドネシア語</option>
        <option value="vi">ベトナム語</option>
        <option value="th">タイ語</option>
        <option value="ar">アラビア語</option>
        <option value="so">ソマリ語</option>
      </select>

      モデル
      <select id="whisper_model">
        <option value="tiny" selected>tiny（高速）</option>
        <option value="base">base（高精度）</option>
        <option value="small">small（さらに高精度・重い）</option>
      </select>

      <button type="button" class="btn btn-primary" id="button">Start</button>
      <button type="button" class="btn btn-primary" id="buttonClear">Clear</button>
      <button type="button" class="btn btn-primary" id="buttonDownload" disabled>Download</button>

      <span id="status" class="ms-3 small text-dark">WebGPU / CPU チェック中...</span>
    </div>
  </header>

  <main class="text-light">
    <div id="text" style="font-size: 500%; padding: 1em; padding-bottom: 0.5em; line-height: 1;"></div>

    <script type="module">
      import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@3.0.0";

      const btnToggle   = document.getElementById("button");
      const btnClear    = document.getElementById("buttonClear");
      const btnDownload = document.getElementById("buttonDownload");
      const textDiv     = document.getElementById("text");
      const statusEl    = document.getElementById("status");

      const sourceSel = document.getElementById("trans_sourcelang");
      const targetSel = document.getElementById("trans_targetlang");
      const modelSel  = document.getElementById("whisper_model");

      let recognizing   = false;
      let mediaStream   = null;
      let mediaRecorder = null;
      let chunks        = [];
      let transcriber   = null;
      let txt           = "";
      let startDate     = null;

      let lastSoundTime = Date.now();
      let silenceTimer  = null;

      // WebGPU or CPU fallback
      async function detectDevice() {
        if ("gpu" in navigator) {
          try {
            const adapter = await navigator.gpu.requestAdapter();
            if (adapter) return "webgpu";
          } catch {}
        }
        return "cpu";
      }

      async function loadModel() {
        const modelName = modelSel.value;
        const modelMap = {
          tiny:  "Xenova/whisper-tiny",
          base:  "Xenova/whisper-base",
          small: "Xenova/whisper-small"
        };

        const deviceType = await detectDevice();

        statusEl.textContent = `モデル読み込み中 (${modelName}, ${deviceType})...`;

        transcriber = await pipeline(
          "automatic-speech-recognition",
          modelMap[modelName],
          { device: deviceType }
        );

        statusEl.textContent = `準備完了（${modelName}, ${deviceType}）`;
      }

      async function startRecognition() {
        recognizing = true;
        btnToggle.innerHTML = "Stop";
        btnToggle.className = "btn btn-danger";
        btnDownload.disabled = true;

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        chunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          if (!recognizing) return;

          const blob = new Blob(chunks, { type: "audio/webm" });
          chunks = [];

          await transcribeBlob(blob);

          if (recognizing) {
            mediaRecorder.start();
            setTimeout(() => {
              if (mediaRecorder.state === "recording") mediaRecorder.stop();
            }, 5000);
          }
        };

        mediaRecorder.start();
        setTimeout(() => {
          if (mediaRecorder.state === "recording") mediaRecorder.stop();
        }, 5000);

        lastSoundTime = Date.now();
        startSilenceTimer();
        statusEl.textContent = "録音中...";
      }

      function stopRecognition() {
        recognizing = false;
        btnToggle.innerHTML = "Start";
        btnToggle.className = "btn btn-primary";
        btnDownload.disabled = (txt === "");

        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

        stopSilenceTimer();
        statusEl.textContent = "停止中";
      }

      async function transcribeBlob(blob) {
        try {
          statusEl.textContent = "解析中...";

          const src = sourceSel.value;
          const tgt = targetSel.value;

          const result = await transcriber(blob, {
            task: tgt === "none" ? "transcribe" : "translate",
            language: src,
            target_lang: tgt === "none" ? undefined : tgt
          });

          const line = (result && result.text) ? result.text.trim() : "";

          if (line) {
            lastSoundTime = Date.now();
            appendText(line);
            if (!startDate) startDate = new Date();
          }

          statusEl.textContent = "録音中...";
        } catch (e) {
          console.error(e);
          statusEl.textContent = "解析エラー";
        }
      }

      function appendText(str) {
        txt += `<p style="margin-bottom:0.5em">${str}</p>`;
        textDiv.innerHTML = txt;
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }

      function textDownload() {
        if (txt === "") return;

        const blob = new Blob(
          [txt.replace(/<p style="margin-bottom:0.5em">/g, "").replace(/<\/p>/g, "\n")],
          { type: "text/plain" }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = (startDate || new Date()) + ".txt";
        a.click();
        URL.revokeObjectURL(url);

        textClear();
      }

      function textClear() {
        txt = "";
        textDiv.innerHTML = "";
        btnDownload.disabled = true;
        startDate = null;
      }

      function startSilenceTimer() {
        stopSilenceTimer();
        silenceTimer = setInterval(() => {
          const now  = Date.now();
          const diff = now - lastSoundTime;
          if (recognizing && diff > 60000 && txt !== "") {
            textDownload();
            lastSoundTime = Date.now();
          }
        }, 5000);
      }

      function stopSilenceTimer() {
        if (silenceTimer) {
          clearInterval(silenceTimer);
          silenceTimer = null;
        }
      }

      btnToggle.addEventListener("click", async () => {
        if (!recognizing) {
          if (!transcriber) await loadModel();
          await startRecognition();
        } else {
          stopRecognition();
        }
      });

      btnClear.addEventListener("click", textClear);
      btnDownload.addEventListener("click", textDownload);

      statusEl.textContent = "モデルを選んで Start を押してください";
    </script>
  </main>
</body>

</html>
